        <!-- Main Content (SPA Container) -->
        <main class="main-content">
            <!-- Top Header -->
            <header class="top-header">

                    <input type="text" placeholder="Search">
                </div>
                <div class="top-header-right">
                    <button class="assign-task-btn" id="main-action-btn">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                        <span id="main-action-text">Assign Task</span>
                    </button>
                    <button class="bell-btn">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                    </button>
                </div>
            </header>

            <div id="main-content-container" class="content-container fade-in">
                <!-- Content will be injected dynamically -->
            </div>
        </main>
    </div>

    <!-- SPA Router Script -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const container = document.getElementById("main-content-container");

            // Function to load and render content from external HTML files
            async function loadPage(pageUrl) {
                if (!pageUrl) return;
                try {
                    // Start transition
                    container.classList.remove("fade-in");
                    container.style.opacity = 0;

                    const response = await fetch(pageUrl);
                    if (!response.ok) {
                        throw new Error(`Failed to load ${pageUrl}`);
                    }
                    const html = await response.text();
                    
                    // Inject content
                    container.innerHTML = html;
                    
                    // Trigger fade-in transition
                    setTimeout(() => {
                        container.classList.add("fade-in");
                        container.style.opacity = 1;
                    }, 50);
                } catch (error) {
                    console.error("Error loading page:", error);
                    container.innerHTML = `
                        <div class="page-header">
                            <h1 class="page-title">Error Loading Page</h1>
                        </div>
                        <div class="card">
                            <p style="color: red;">Failed to load the page content: ${error.message}</p>
                        </div>`;
                }
            }
            
            // Expose globally so inline onclick handlers in fragments can use it
            window.loadPage = loadPage;

            // Set up Dropdown Toggle
            const dropdowns = document.querySelectorAll(".nav-item.has-dropdown");
            dropdowns.forEach(dropdown => {
                dropdown.addEventListener("click", (e) => {
                    e.preventDefault();
                    const parent = dropdown.parentElement;
                    const subMenu = parent.querySelector(".sub-menu");
                    
                    dropdown.classList.toggle("open");
                    if (subMenu) {
                        subMenu.classList.toggle("open");
                    }
                });
            });

            // Set up Page Navigation
            const navLinks = document.querySelectorAll("[data-page]");
            navLinks.forEach(link => {
                link.addEventListener("click", (e) => {
                    e.preventDefault();
                    
                    // Remove active from all nav and sub menu items
                    document.querySelectorAll(".nav-item, .sub-item").forEach(item => {
                        item.classList.remove("active");
                    });

                    // Add active class
                    link.classList.add("active");
                    
                    // If it is a sub item, also make its parent dropdown active/active-styled
                    if (link.classList.contains("sub-item")) {
                        const parentDropdown = link.closest("div").querySelector(".nav-item");
                        if (parentDropdown) {
                            parentDropdown.classList.add("active");
                        }
                    }

                    const page = link.getAttribute("data-page");
                    

                    loadPage(page);
                });
            });

            // Load initial view
            loadPage("sectionEditor_overview.html");
        });
    </script>
</body>
</html>
