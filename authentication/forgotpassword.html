<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TheSPARK</title>
    <link rel="icon" href="../Assets/White_Spark_Logo.png">
    <link rel="stylesheet" href="../styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- Left Section -->
        <div class="left-section">
            <div class="logo-container">
                <img src="../Assets/White_Spark_Logo.png" alt="The SPARK Logo" class="logo">
                <h1>TheSPARK</h1>
                <p>Truth knows no limits</p>
            </div>
        </div>

        <!-- Right Section -->
        <div class="right-section">
            <div class="form-container">
                <h2>Reset Password</h2>
                <p class="subtitle">Please enter your registered email address to<br>receive a password recovery link.</p>
                
                <form>
                    <div class="input-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" placeholder="youremail@thesparkpub.com" required autofocus>
                    </div>
                    
                    <button type="submit" class="submit-btn">Continue</button>
                </form>
                
                <p class="spam-notice">Can't find it? Check your spam or junk folder.</p>

                <div class="return-container">
                    <a href="login.html" class="return-btn">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="return-icon"><path d="m15 18-6-6 6-6"/></svg>
                        Return to Sign In
                    </a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
