<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TheSPARK</title>
    <link rel="icon" href="../Assets/White_Spark_Logo.png">
    <link rel="stylesheet" href="../styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- Left Section -->
        <div class="left-section">
            <div class="logo-container">
                <img src="../Assets/White_Spark_Logo.png" alt="The SPARK Logo" class="logo">
                <h1>TheSPARK</h1>
                <p>Truth knows no limits</p>
            </div>
        </div>

        <!-- Right Section -->
        <div class="right-section">
            <div class="form-container">
                <h2>Almost There</h2>
                <p class="subtitle">You're one step away. Enter the 6-digit code sent to<br>your email to get started.</p>
                
                <form>
                    <div class="otp-container">
                        <input type="text" maxlength="1" class="otp-input" autofocus>
                        <input type="text" maxlength="1" class="otp-input">
                        <input type="text" maxlength="1" class="otp-input">
                        <input type="text" maxlength="1" class="otp-input">
                        <input type="text" maxlength="1" class="otp-input">
                        <input type="text" maxlength="1" class="otp-input">
                    </div>
                    
                    <button type="submit" class="submit-btn">Continue</button>
                </form>
                
                <p class="signup-text">Didn't receive the code? <a href="#">Request again</a></p>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const otpInputs = document.querySelectorAll('.otp-input');

            otpInputs.forEach((input, index) => {
                input.addEventListener('input', (e) => {
                    // Focus next input when a number is typed
                    if (input.value.length === 1 && index < otpInputs.length - 1) {
                        otpInputs[index + 1].focus();
                    }
                });

                input.addEventListener('keydown', (e) => {
                    // Focus previous input on backspace if current is empty
                    if (e.key === 'Backspace' && input.value === '' && index > 0) {
                        otpInputs[index - 1].focus();
                    }
                });
                
                // Allow users to paste a full 6-digit code
                input.addEventListener('paste', (e) => {
                    e.preventDefault();
                    const pastedData = e.clipboardData.getData('text').slice(0, otpInputs.length).split('');
                    if (pastedData.length > 0) {
                        pastedData.forEach((char, i) => {
                            if (index + i < otpInputs.length) {
                                otpInputs[index + i].value = char;
                                if (index + i < otpInputs.length - 1) {
                                    otpInputs[index + i + 1].focus();
                                } else {
                                    otpInputs[index + i].focus(); // Focus last one
                                }
                            }
                        });
                    }
                });
            });
        });
    </script>
</body>
</html>
