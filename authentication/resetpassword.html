<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TheSPARK</title>
    <link rel="icon" href="../Assets/White_Spark_Logo.png">
    <link rel="stylesheet" href="../styles.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Manrope:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="container">
        <!-- Left Section -->
        <div class="left-section">
            <div class="logo-container">
                <img src="../Assets/White_Spark_Logo.png" alt="The SPARK Logo" class="logo">
                <h1>TheSPARK</h1>
                <p>Truth knows no limits</p>
            </div>
        </div>

        <!-- Right Section -->
        <div class="right-section">
            <div class="form-container">
                <h2>Create a secure password</h2>
                <p class="subtitle">Changing password for (email here)<br>Include a mix of letters, numbers, and
                    symbols.</p>

                <form>
                    <div class="input-group password-group">
                        <label for="password">New Password</label>
                        <div class="password-wrapper">
                            <input type="password" id="password" placeholder="Enter password" required autofocus>
                            <svg class="eye-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </div>
                        <div class="password-wrapper confirm-wrapper">
                            <input type="password" id="confirm-password" placeholder="Confirm password" required>
                            <svg class="eye-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </div>
                        <p id="password-match-notice"
                            style="color: #d93025; font-size: 13px; font-weight: 500; margin-top: 10px; display: none;">
                            Passwords do not match.</p>
                    </div>

                    <button type="submit" class="submit-btn">Continue</button>
                </form>

                <div class="return-container">
                    <a href="login.html" class="return-btn">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            class="return-icon">
                            <path d="m15 18-6-6 6-6" />
                        </svg>
                        Return to Sign In
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Toggle Password Visibility
            const toggleIcons = document.querySelectorAll('.eye-icon');
            toggleIcons.forEach(icon => {
                icon.addEventListener('click', () => {
                    const input = icon.previousElementSibling;
                    if (input.type === 'password') {
                        input.type = 'text';
                        icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
                    } else {
                        input.type = 'password';
                        icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
                    }
                });
            });

            // Password Match Check
            const password = document.getElementById('password');
            const confirmPassword = document.getElementById('confirm-password');
            const notice = document.getElementById('password-match-notice');
            const submitBtn = document.querySelector('.submit-btn');

            function checkMatch() {
                if (confirmPassword.value && password.value !== confirmPassword.value) {
                    notice.style.display = 'block';
                    submitBtn.disabled = true;
                    submitBtn.style.opacity = '0.7';
                    submitBtn.style.cursor = 'not-allowed';
                } else {
                    notice.style.display = 'none';
                    submitBtn.disabled = false;
                    submitBtn.style.opacity = '1';
                    submitBtn.style.cursor = 'pointer';
                }
            }

            password.addEventListener('input', checkMatch);
            confirmPassword.addEventListener('input', checkMatch);
        });
    </script>
</body>

</html>
