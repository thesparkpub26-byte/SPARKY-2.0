    <!-- SPA Router Script -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const container = document.getElementById("main-content-container");

            // Function to load and render content from external HTML files (with file:// fallback)
            async function loadPage(pageUrl) {
                if (!pageUrl) return;
                try {
                    // Start transition
                    container.classList.remove("fade-in");
                    container.style.opacity = 0;

                    let html = "";
                    try {
                        const response = await fetch(pageUrl);
                        if (response.ok) {
                            html = await response.text();
                        }
                    } catch (fetchErr) {
                        // Fallback for file:// protocol where fetch is blocked by CORS
                        const templateId = "template-" + pageUrl.replace(".html", "");
                        const tmpl = document.getElementById(templateId);
                        if (tmpl) {
                            html = tmpl.innerHTML;
                        } else {
                            throw fetchErr;
                        }
                    }

                    if (!html) {
                        const templateId = "template-" + pageUrl.replace(".html", "");
                        const tmpl = document.getElementById(templateId);
                        if (tmpl) html = tmpl.innerHTML;
                    }
                    
                    // Inject content
                    container.innerHTML = html;
                    
                    // Trigger fade-in transition
                    setTimeout(() => {
                        container.classList.add("fade-in");
                        container.style.opacity = 1;
                    }, 50);
                } catch (error) {
                    console.error("Error loading page:", error);
                    container.innerHTML = `
                        <div class="page-header">
                            <h1 class="page-title">Error Loading Page</h1>
                        </div>
                        <div class="card" style="padding: 24px; background: #fff; border-radius: 16px;">
                            <p style="color: red;">Failed to load the page content: ${error.message}</p>
                        </div>`;
                }
            }
            
            // Expose globally so inline handlers can use it
            window.loadPage = loadPage;

            // Set up Page Navigation
            const navLinks = document.querySelectorAll("[data-page]");
            navLinks.forEach(link => {
                link.addEventListener("click", (e) => {
                    e.preventDefault();
                    
                    // Remove active from all nav items
                    document.querySelectorAll(".nav-item").forEach(item => {
                        item.classList.remove("active");
                    });

                    // Add active class
                    link.classList.add("active");

                    const page = link.getAttribute("data-page");
                    loadPage(page);
                });
            });

            // Load initial view
            loadPage("staffArtist_tasks.html");
        });
    </script>
</body>
</html>
